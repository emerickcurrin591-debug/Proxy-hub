<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>TeaProxy</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#05060a;
  color:white;
  overflow:hidden;
}

/* Animated background */

body{
  background:
    radial-gradient(circle at 20% 20%,#351c68 0,transparent 30%),
    radial-gradient(circle at 80% 80%,#003f5c 0,transparent 30%),
    #05060a;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      120deg,
      transparent 0%,
      rgba(255,255,255,.025) 50%,
      transparent 100%
    );
  animation:shine 8s linear infinite;
}

@keyframes shine{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}
}

/* Main app */

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* Header */

.header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;

  background:rgba(10,11,18,.78);
  backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  font-weight:800;
}

.logoIcon{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:linear-gradient(
    135deg,
    #8b5cf6,
    #06b6d4
  );

  box-shadow:
    0 0 25px rgba(139,92,246,.45);
}

.status{
  display:flex;
  align-items:center;
  gap:8px;

  color:#9ca3af;
  font-size:13px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 12px #22c55e;
}

/* Navigation */

.nav{
  display:flex;
  gap:8px;
}

.nav button{
  border:0;
  background:transparent;
  color:#9ca3af;

  padding:10px 14px;
  border-radius:9px;

  cursor:pointer;
  transition:.2s;
}

.nav button:hover{
  color:white;
  background:rgba(255,255,255,.07);
}

/* Browser controls */

.browser{
  padding:14px 20px;

  background:rgba(12,13,20,.7);
  backdrop-filter:blur(16px);

  border-bottom:1px solid rgba(255,255,255,.06);
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
}

.control{
  width:42px;
  height:42px;

  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;

  background:#11131c;
  color:white;

  cursor:pointer;
  font-size:17px;

  transition:.2s;
}

.control:hover{
  background:#1c2030;
  transform:translateY(-1px);
}

.address{
  flex:1;

  height:42px;

  padding:0 16px;

  border-radius:10px;

  border:1px solid rgba(255,255,255,.08);

  background:#0d0f16;

  color:white;
  outline:none;

  font-size:14px;
}

.address:focus{
  border-color:#8b5cf6;

  box-shadow:
    0 0 0 3px rgba(139,92,246,.12);
}

.go{
  height:42px;

  padding:0 20px;

  border:0;
  border-radius:10px;

  background:linear-gradient(
    135deg,
    #8b5cf6,
    #06b6d4
  );

  color:white;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 0 20px rgba(139,92,246,.2);
}

.go:hover{
  filter:brightness(1.15);
}

/* Quick links */

.quick{
  display:flex;
  gap:8px;
  margin-top:10px;
  overflow:auto;
}

.quick button{
  white-space:nowrap;

  border:1px solid rgba(255,255,255,.07);

  background:#10121a;
  color:#aeb4c2;

  padding:7px 12px;

  border-radius:20px;

  cursor:pointer;
}

.quick button:hover{
  color:white;
  border-color:#8b5cf6;
}

/* Viewer */

.viewerWrap{
  position:relative;
  flex:1;
  padding:14px;
}

.viewer{
  width:100%;
  height:100%;

  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;

  background:white;

  box-shadow:
    0 20px 70px rgba(0,0,0,.35);
}

/* Welcome */

.welcome{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  pointer-events:none;
}

.welcomeCard{
  text-align:center;

  padding:45px;

  border-radius:24px;

  background:rgba(13,15,22,.82);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 30px 80px rgba(0,0,0,.4);
}

.welcomeIcon{
  font-size:55px;
  margin-bottom:12px;
}

.welcome h1{
  margin:0 0 8px;
  font-size:32px;
}

.welcome p{
  margin:0;
  color:#8f96a6;
}

/* Fullscreen */

.fullscreen{
  position:fixed;
  right:22px;
  bottom:22px;

  width:48px;
  height:48px;

  border:1px solid rgba(255,255,255,.1);

  border-radius:14px;

  background:#11131c;
  color:white;

  cursor:pointer;

  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.fullscreen:hover{
  background:#1b1e2a;
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="logo">
    <div class="logoIcon">⚡</div>
    TeaProxy
  </div>

  <div class="nav">
    <button onclick="home()">Home</button>
    <button onclick="focusURL()">Browse</button>
  </div>

  <div class="status">
    <span class="dot"></span>
    Online
  </div>

</header>


<div class="browser">

  <div class="controls">

    <button class="control" onclick="history.back()">
      ←
    </button>

    <button class="control" onclick="history.forward()">
      →
    </button>

    <button class="control" onclick="reload()">
      ↻
    </button>

    <input
      id="url"
      class="address"
      placeholder="Enter an authorized website..."
      onkeydown="if(event.key==='Enter')go()"
    >

    <button class="go" onclick="go()">
      GO
    </button>

  </div>


  <div class="quick">

    <button onclick="quick('https://example.com')">
      Example
    </button>

    <button onclick="quick('https://wikipedia.org')">
      Wikipedia
    </button>

    <button onclick="quick('https://developer.mozilla.org')">
      MDN
    </button>

  </div>

</div>


<div class="viewerWrap">

  <iframe
    id="viewer"
    class="viewer"
    title="Web Viewer">
  </iframe>


  <div
    id="welcome"
    class="welcome">

    <div class="welcomeCard">

      <div class="welcomeIcon">
        ⚡
      </div>

      <h1>TeaProxy</h1>

      <p>
        Enter an authorized website above
      </p>

    </div>

  </div>

</div>


<button
  class="fullscreen"
  onclick="fullscreen()">
  ⛶
</button>

</div>


<script>

const viewer=
document.getElementById("viewer");

const url=
document.getElementById("url");

const welcome=
document.getElementById("welcome");


function go(){

let value=url.value.trim();

if(!value)return;

if(!/^https?:\/\//i.test(value)){
  value="https://"+value;
}

viewer.src=
"/proxy?url="+
encodeURIComponent(value);

welcome.style.display="none";

}


function quick(site){

url.value=site;

go();

}


function reload(){

if(viewer.src){
  viewer.src=viewer.src;
}

}


function home(){

viewer.src="";
url.value="";
welcome.style.display="flex";

}


function focusURL(){

url.focus();

}


function fullscreen(){

const target=
document.querySelector(".viewerWrap");

if(!document.fullscreenElement){

target.requestFullscreen();

}else{

document.exitFullscreen();

}

}

</script>

</body>
</html>
